<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box - Personal Cloud</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0a0a0f;
  color:#f5f5f7;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.loading-box{
  text-align:center;
  padding:40px;
}
.logo{
  width:80px;height:80px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:700;color:#fff;
  margin:0 auto 20px;
  box-shadow:0 20px 60px rgba(99,102,241,0.4);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}
h1{font-size:20px;font-weight:600;margin-bottom:8px}
p{font-size:14px;color:#a1a1aa}
.spinner{
  width:32px;height:32px;
  border:3px solid #23232e;
  border-top:3px solid #6366f1;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:20px auto 0;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading-box">
  <div class="logo">B</div>
  <h1>Box</h1>
  <p>Opening your cloud...</p>
  <div class="spinner"></div>
</div>

  <script>
(async function(){

  const params = new URLSearchParams(window.location.search);

  let shortCode = params.get("code");

  if (!shortCode) {
    const path = window.location.pathname;
    const parts = path.split("/").filter(Boolean);
    shortCode = parts[parts.length - 1] || "";
  }

  if (!shortCode || shortCode === "box") {
    document.querySelector("h1").textContent = "Box";
    document.querySelector("p").textContent = "Your Personal Cloud";
    document.querySelector(".spinner").style.display = "none";
    return;
  }

  try {

    const response = await fetch("links.json");

    if (!response.ok) {
      throw new Error("Unable to load links.json");
    }

    const links = await response.json();

    const targetUrl = links[shortCode];

    if (targetUrl) {
      window.location.replace(targetUrl);
    } else {
      document.querySelector("h1").textContent = "Link Not Found";
      document.querySelector("p").textContent =
        "No cloud found for: " + shortCode;
      document.querySelector(".spinner").style.display = "none";
    }

  } catch(error) {

    document.querySelector("h1").textContent = "Error";
    document.querySelector("p").textContent = error.message;
    document.querySelector(".spinner").style.display = "none";

  }

})();
</script>
</body>
</html>
