<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box - URL Shortener</title>
<style>
:root{
  --bg:#0a0a0f;
  --surface:#131318;
  --border:#23232e;
  --text:#f5f5f7;
  --text2:#a1a1aa;
  --accent:#6366f1;
  --accent2:#8b5cf6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.container{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:40px;
  max-width:600px;
  width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.logo{
  width:60px;height:60px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:#fff;
  margin-bottom:20px;
}
h1{font-size:24px;font-weight:700;margin-bottom:6px}
.subtitle{font-size:14px;color:var(--text2);margin-bottom:30px}
.field{margin-bottom:16px}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
  color:var(--text2);
}
input{
  width:100%;
  padding:12px 16px;
  border:1.5px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  transition:all 0.3s;
}
input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(99,102,241,0.15);
}
button{
  width:100%;
  padding:14px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border:0;
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.3s;
  margin-top:10px;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(99,102,241,0.4);
}
.result{
  display:none;
  margin-top:20px;
  padding:20px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
}
.result h3{
  font-size:14px;
  color:var(--text2);
  margin-bottom:10px;
}
.short-url{
  background:var(--surface);
  padding:12px;
  border-radius:8px;
  border:1px solid var(--accent);
  font-size:14px;
  color:var(--accent);
  cursor:pointer;
  word-break:break-all;
  margin-bottom:10px;
}
.short-url:hover{background:rgba(99,102,241,0.1)}
.copy-btn{
  padding:8px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  cursor:pointer;
  font-size:12px;
  margin-top:8px;
}
.copy-btn:hover{border-color:var(--accent)}
.note{
  margin-top:20px;
  padding:12px;
  background:rgba(99,102,241,0.1);
  border-radius:8px;
  font-size:12px;
  color:var(--text2);
  line-height:1.5;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">B</div>
  <h1>Box URL Shortener</h1>
  <p class="subtitle">Private tool - Only for admin</p>
  
  <div class="field">
    <label>Customer Name (for short URL)</label>
    <input id="customerName" placeholder="rahul">
  </div>
  
  <div class="field">
    <label>Google Script URL (lamba wala)</label>
    <input id="scriptUrl" placeholder="https://script.google.com/macros/s/...">
  </div>
  
  <button onclick="generateShortUrl()">Generate Short URL</button>
  
  <div class="result" id="result">
    <h3>Short URL Ready:</h3>
    <div class="short-url" id="shortUrl" onclick="copyUrl()"></div>
    <button class="copy-btn" onclick="copyUrl()">📋 Copy URL</button>
  </div>
  
  <div class="note">
    <strong>Note:</strong> Ye URL customer ko dena hai. Customer ise kholega to directly dashboard pe jayega.
  </div>
</div>

<script>
function generateShortUrl(){
  const name = document.getElementById('customerName').value.trim().toLowerCase();
  const scriptUrl = document.getElementById('scriptUrl').value.trim();
  
  if(!name || !scriptUrl){
    alert('Customer name aur Script URL dono bharna zaroori hai');
    return;
  }
  
  // Clean name (remove special chars)
  const cleanName = name.replace(/[^a-z0-9]/g, '');
  
  const shortUrl = 'https://softappweber.github.io/box/' + cleanName;
  
  document.getElementById('shortUrl').textContent = shortUrl;
  document.getElementById('result').style.display = 'block';
  
  // Show instruction to update links.json
  console.log('Add to links.json:');
  console.log('"' + cleanName + '": "' + scriptUrl + '"');
  
  alert('Ab links.json file mein ye line add karo:\n\n"' + cleanName + '": "' + scriptUrl + '"');
}

function copyUrl(){
  const url = document.getElementById('shortUrl').textContent;
  navigator.clipboard.writeText(url).then(() => {
    alert('URL copied to clipboard!');
  });
}
</script>
</body>
</html>
